.btn-primary{background:var(--accent);color:#fff}

.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg4)}

.timer.safe{color:#4ade80;background:rgba(34,197,94,.08)}
.timer.warn{color:#facc15;background:rgba(250,204,21,.08)}
.timer.danger{color:#f87171;background:rgba(239,68,68,.08);animation:pulse .3s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.6}}

.opp-bar strong{color:var(--accent)}

  {name:"迈克尔·汤普森",nameEn:"Mychal Thompson",team:"湖人",number:43,position:"中锋",age:71,championships:2,mvp:0,fmvp:0,allNba:0,isActive:false,difficulty:"hard",points:12810,rank:250},
];
const SEARCH = PLAYERS;

function fuzzyMatch(q, n, ne) { q = q.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff\s·]/g, ""); if (!q) return 0; const nc = n.toLowerCase(); if (nc === q) return 1; if (nc.includes(q)) return .85; if (ne) { const e = ne.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, ""); if (e === q) return .95; if (e.startsWith(q)) return .8; if (e.includes(q)) return .65; const qp = q.split(/\s+/), ep = e.split(/\s+/); let m = 0; for (const p of qp) { if (p.length < 2) continue; for (const x of ep) { if (x === p) { m += 2; break } else if (x.startsWith(p)) { m += 1; break } } } const t = qp.filter(p => p.length >= 2).length; if (t > 0 && m / t > .4) return .5 } return 0 }
function search(q) { return SEARCH.map(p => ({ p, s: fuzzyMatch(q, p.name, p.nameEn) })).filter(r => r.s > .3).sort((a, b) => b.s - a.s).slice(0, 8).map(r => r.p) }
function compareNum(g, t) { if (g === t) return { value: g, level: "correct" }; return { value: g, level: "wrong", hint: t > g ? "↑" : "↓" } }
function comparePos(g, t) { if (g === t) return { value: g, level: "correct" }; const pg = ["控球后卫", "得分后卫"], sf = ["小前锋", "大前锋"], bg = ["大前锋", "中锋"]; if ((pg.includes(g) && pg.includes(t)) || (sf.includes(g) && sf.includes(t)) || (bg.includes(g) && bg.includes(t))) return { value: g, level: "close" }; return { value: g, level: "wrong" } }
function compare(g, t) { return { name: g.name, correct: g.name === t.name, attrs: { team: { value: g.team, level: g.team === t.team ? "correct" : "wrong" }, position: comparePos(g.position, t.position), age: compareNum(g.age, t.age), championships: compareNum(g.championships, t.championships), mvp: compareNum(g.mvp, t.mvp), fmvp: compareNum(g.fmvp, t.fmvp), allNba: compareNum(g.allNba, t.allNba) } } }
function cell(a) { if (!a || a.value === undefined || a.value === null) return '<td class="wrong">-</td>'; const c = a.level, arrow = a.hint ? `<span style="margin-left:2px;font-size:.7rem">${a.hint === "↑" ? "↑" : "↓"}</span>` : ""; return `<td class="${c}">${a.value}${arrow}</td>` }

// === Game State ===
const ROUND_MS = 120000, NEXT_DELAY = 6000, POLL_MS = 1000;
let room = null, pNum = null, rPoll = null, tmr = null, clockAnchor = null;
let myW = 0, oppW = 0, roundN = 1, boTarget = 2;
let guesses = [], oppFB = [], target = null, roundActive = false;

function serverNow() { if (clockAnchor) return Date.now() - clockAnchor.clientNow + clockAnchor.serverNow; return Date.now() }
function deadline(iso) { if (!iso) return null; const d = new Date(iso).getTime(); if (clockAnchor) return d; return d }

function render(s) {
  const v = document.getElementById("view");
  if (s === "lobby") v.innerHTML = `<div class="lobby"><h3>🏀 竞技对战</h3>
    <p>随机匹配玩家 · 120秒限时 · 服务端计时</p>
    <div style="display:flex;justify-content:center;gap:8px;margin:16px 0">
      ${[1, 3, 5].map(n => `<button class="btn ${boTarget===n?"btn-primary":"btn-secondary"}" style="padding:6px 18px;font-size:.85rem" onclick="setBO(${n})">BO${n}</button>`).join("")}</div>
    <button class="btn btn-primary" style="font-size:1.1rem;padding:14px 40px" onclick="startSearch()">🎲 快速匹配</button></div>`;
  else if (s === "searching") v.innerHTML = `<div class="searching"><div class="spinner"></div><h3>🎲 正在匹配对手</h3><p style="color:var(--text2)">等待在线玩家...</p><button class="btn btn-secondary" style="margin-top:12px" onclick="cancel()">取消</button></div>`;
  else if (s === "found") { guesses = []; oppFB = []; v.innerHTML = `<div class="ready-box"><h3>🤝 对手已匹配</h3>
    <div class="score" style="margin:16px 0"><div class="s"><div class="n">你</div><div class="p me">${myW}</div></div><div class="vs">VS</div><div class="s"><div class="n">对手</div><div class="p opp">${oppW}</div></div></div>
    <p style="color:var(--text2);font-size:.85rem">BO${boTarget} · 率先赢得${Math.ceil(boTarget/2)}轮者获胜</p>
    <button class="btn btn-primary" style="margin-top:12px" id="rdy-btn" onclick="doReady()">✅ 准备</button>
    <p style="color:var(--text2);font-size:.75rem;margin-top:8px" id="rdy-status">等待双方准备...</p></div>` }
  else if (s === "playing") renderGame(v);
  else if (s === "match-end") renderMatchEnd(v);
}
function setBO(n) { boTarget = n }
async function startSearch() {
  render("searching");
  const list = await api("GET", "rooms?match_status=eq.matching&p2_id=is.null&order=created_at&limit=1&select=*");
  if (list && list.length && list[0].p1_id !== pid) {
    const r = list[0]; await api("PATCH", "rooms?id=eq." + r.id, { p2_id: pid, match_status: "found" });
    room = r; pNum = 2; myW = 0; oppW = 0; startPoll(r.id); render("found"); return;
  }
  const d = await api("POST", "rooms", { code: Array.from({ length: 6 }, () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[Math.floor(Math.random() * 36)]).join(""), p1_id: pid, match_status: "matching", p1_rounds_won: 0, p2_rounds_won: 0, round: 1 });
  if (!d || !d.length) { render("lobby"); return }
  room = d[0]; pNum = 1; myW = 0; oppW = 0; startPoll(d[0].id);
}
function startPoll(rid) {
  stopPoll(); rPoll = setInterval(async () => {
    try {
      const l = await api("GET", "rooms?id=eq." + rid + "&select=*"); if (!l || !l.length) return; const r = l[0]; room = r;
      if (r.timer_end) clockAnchor = { serverNow: new Date(r.timer_end).getTime(), clientNow: Date.now() };
      const op = pNum === 1 ? 2 : 1;
      if (r.p1_ready && r.p2_ready && r.match_status === "found") { startRound(r); return }
      if (r.match_status === "playing") { oppFB = r["p" + op + "_guess_feedback"] || []; updateOpp(); return }
      if (r.match_status === "round_end") { stopPoll(); endRound(r); return }
      if (r.match_status === "match_end") { stopPoll(); matchEnd(); return }
      const st = document.getElementById("rdy-status"); if (st) st.textContent = pNum === 1 ? (r.p2_id ? "对手已加入" : "等待对手加入...") : "等待双方准备...";
    } catch (e) { }
  }, POLL_MS);
}
function stopPoll() { if (rPoll) { clearInterval(rPoll); rPoll = null } }
async function doReady() { await api("PATCH", "rooms?id=eq." + room.id, { ["p" + pNum + "_ready"]: true }); document.getElementById("rdy-btn").disabled = true; document.getElementById("rdy-btn").textContent = "已准备 ✓" }
async function startRound(r) {
  roundN = r.round || 1; guesses = []; oppFB = []; roundActive = true;
  target = PLAYERS[Math.floor(Math.random() * PLAYERS.length)];
  const endTime = new Date(Date.now() + ROUND_MS).toISOString();
  await api("PATCH", "rooms?id=eq." + r.id, { match_status: "playing", round: roundN, timer_end: endTime, p1_guess_feedback: [], p2_guess_feedback: [], p1_ready: false, p2_ready: false, target_json: target, target_player_name: target.name, target_player_team: target.team, target_player_rank: target.rank, target_player_points: target.points });
  clockAnchor = { serverNow: Date.now() + ROUND_MS, clientNow: Date.now() };
  render("playing"); startTimer();
}
function renderGame(v) {
  v.innerHTML = `<div class="timer safe" id="timer">120</div>
    <div class="score"><div class="s"><div class="n">你</div><div class="p me">${myW}</div></div><div class="vs">VS</div><div class="s"><div class="n">对手</div><div class="p opp">${oppW}</div></div></div>
    <div class="opp-bar">对手猜测: <strong id="oc">${(oppFB || []).length}/8</strong><div class="dots" id="od"></div></div>
    <div class="search-wrap"><input type="text" class="search-input" id="inp" placeholder="输入球员名搜索..." autocomplete="off"><div class="search-dropdown" id="dd"></div></div>
    <div class="game-table-wrap"><table class="game-table"><thead><tr><th>球员</th><th>队伍</th><th>位置</th><th>年龄</th><th>总冠军</th><th>MVP</th><th>FMVP</th><th>最佳阵容</th><th>状态</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div style="text-align:center;font-size:.8rem;color:var(--text2)">你的猜测: <strong style="color:var(--accent)" id="ct">${guesses.length}/8</strong></div>`;
  const inp = document.getElementById("inp"), dd = document.getElementById("dd");
  inp.addEventListener("input", () => { const q = inp.value.trim(); if (!q) { dd.classList.remove("show"); dd.innerHTML = ""; return } const r = search(q); dd.innerHTML = r.length ? r.map(p => `<div class="search-item" data-n="${p.name}"><span class="name">${p.name}</span><span class="team">${p.team}</span></div>`).join("") : '<div class="no-results">未找到</div>'; dd.classList.add("show") });
  dd.addEventListener("click", e => { const el = e.target.closest(".search-item"); if (!el) return; const p = PLAYERS.find(x => x.name === el.dataset.n); if (p) doGuess(p) });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { const r = search(inp.value.trim()); if (r.length) doGuess(r[0]) } });
  updateOpp();
}
function updateOpp() { const fb = oppFB || []; const el = document.getElementById("od"); if (!el) return; const oc = document.getElementById("oc"); if (oc) oc.textContent = fb.length + "/8"; el.innerHTML = fb.map(c => `<span style="background:${c === "correct" ? "#22c55e" : c === "close" ? "#eab308" : "#334155"}"></span>`).join("") }
async function doGuess(p) {
  if (!target || guesses.length >= 8 || guesses.some(x => x.name === p.name)) return; guesses.push(p); const fb = compare(p, target);
  await api("PATCH", "rooms?id=eq." + room.id, { ["p" + pNum + "_guess_feedback"]: guesses.map(x => { const f = compare(x, target); return f.correct ? "correct" : (f.attrs.team.level === "correct" || f.attrs.position.level === "correct" || Object.values(f.attrs).some(a => a.level === "correct") ? "close" : "wrong") }) });
  document.getElementById("ct").textContent = guesses.length + "/8";
  document.getElementById("tb").innerHTML = guesses.map((x, i) => { const f = compare(x, target); return `<tr class="${i === guesses.length - 1 ? "row-latest" : ""} ${f.correct ? "row-correct" : ""}"><td class="name-cell ${f.correct ? "correct" : "wrong"}">${f.name}</td>${cell(f.attrs.team)}${cell(f.attrs.position)}${cell(f.attrs.age)}${cell(f.attrs.championships)}${cell(f.attrs.mvp)}${cell(f.attrs.fmvp)}${cell(f.attrs.allNba)}${f.correct ? '<td class="correct">现役</td>' : '<td class="wrong">-</td>'}</tr>` }).join("");
  document.getElementById("inp").value = ""; document.getElementById("dd").classList.remove("show");
  if (fb.correct) { roundActive = false; const wcol = "p" + pNum + "_rounds_won"; const cr = (await api("GET", "rooms?id=eq." + room.id + "&select=*"))[0]; const mw = (cr[wcol] || 0) + 1; await api("PATCH", "rooms?id=eq." + room.id, { [wcol]: mw, match_status: mw >= Math.ceil(boTarget / 2) ? "match_end" : "round_end" }); stopPoll(); return }
  if (guesses.length >= 8 && (oppFB || []).length >= 8) { roundActive = false; await api("PATCH", "rooms?id=eq." + room.id, { match_status: "round_end" }); stopPoll() }
}
function startTimer() {
  if (tmr) clearInterval(tmr);
  const total = 120; tmr = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((deadline(clockAnchor?.serverNow ? new Date(clockAnchor.serverNow).toISOString() : null) || (Date.now() + total * 1000)) - Date.now()) / 1000);
    const el = document.getElementById("timer"); if (!el) { clearInterval(tmr); return }
    el.textContent = remaining; el.className = "timer " + (remaining > 60 ? "safe" : remaining > 20 ? "warn" : "danger");
    if (remaining <= 0) { clearInterval(tmr); onTimeout() }
  }, 500);
}
async function onTimeout() {
  if (!roundActive) return;
  const r = await api("GET", "rooms?id=eq." + room.id + "&select=*");
  if (r[0] && r[0].match_status === "playing") { roundActive = false; await api("PATCH", "rooms?id=eq." + r[0].id, { match_status: "round_end" }) }
}
async function endRound(r) {
  clearInterval(tmr);
  if (!target) { target = r.target_json }
  const op = pNum === 1 ? 2 : 1;
  myW = r["p" + pNum + "_rounds_won"] || 0; oppW = r["p" + op + "_rounds_won"] || 0;
  const needed = Math.ceil(boTarget / 2);
  const iWon = r["p" + pNum + "_rounds_won"] > (room["p" + pNum + "_rounds_won"] || 0);
  room = r;
  const ov = document.createElement("div"); ov.className = "modal-overlay"; ov.id = "end-modal";
  ov.innerHTML = `<div class="modal ${iWon ? "win" : "draw"}"><h3>${iWon ? "🎉 你猜中了！" : "⏰ 时间到！"}</h3>
    <div class="pname">${target.name}</div><p style="color:var(--text2)">${target.team} · ${target.position}</p>
    <div class="grid"><div class="k">总冠军</div><div class="v">${target.championships}</div><div class="k">MVP</div><div class="v">${target.mvp}</div><div class="k">FMVP</div><div class="v">${target.fmvp}</div><div class="k">最佳阵容</div><div class="v">${target.allNba}次</div><div class="k">历史排名</div><div class="v">第${target.rank}名</div><div class="k">生涯得分</div><div class="v">${target.points.toLocaleString()}</div></div>
    <div class="score" style="margin:12px 0"><div class="s"><div class="n">你</div><div class="p me">${myW}</div></div><div class="vs">VS</div><div class="s"><div class="n">对手</div><div class="p opp">${oppW}</div></div></div>
    <p style="color:var(--text2);font-size:.75rem">${myW >= needed || oppW >= needed ? "" : (NEXT_DELAY / 1000) + "秒后自动开始下一轮"}</p>
    <button class="btn btn-primary" style="margin-top:8px" onclick="nx()">${myW >= needed || oppW >= needed ? "查看结果" : "下一轮"}</button></div>`;
  document.body.appendChild(ov);
  if (myW < needed && oppW < needed) setTimeout(() => { if (document.getElementById("end-modal")) nx() }, NEXT_DELAY);
}
async function nx() {
  const m = document.getElementById("end-modal"); if (m) { m.remove() }
  const needed = Math.ceil(boTarget / 2);
  if (myW >= needed || oppW >= needed) { matchEnd(); return }
  roundN++; await api("PATCH", "rooms?id=eq." + room.id, { round: roundN, match_status: "found", p1_ready: false, p2_ready: false }); startPoll(room.id); render("found");
}
function matchEnd() {
  stopPoll(); const m = document.getElementById("end-modal"); if (m) m.remove();
  const v = document.getElementById("view"); const won = myW >= Math.ceil(boTarget / 2);
  v.innerHTML = `<div class="match-result"><h2>${won ? "🎉 你赢下了整场比赛！" : "😢 对手获胜"}</h2>
    <div class="fs"><span class="${won ? '' : 'w'}">${myW}</span>:<span class="${won ? 'w' : ''}">${oppW}</span></div>
    <p style="color:var(--text2)">${won ? "率先拿下赛点" : "对手率先拿下赛点"} · BO${boTarget}</p>
    <button class="btn btn-primary" style="margin-top:16px" onclick="quit()">返回大厅</button></div>`;
}
async function cancel() { if (room) await api("DELETE", "rooms?id=eq." + room.id); stopPoll(); room = null; render("lobby") }
function quit() { stopPoll(); room = null; myW = 0; oppW = 0; guesses = []; target = null; render("lobby") }
render("lobby");
</script></body></html>
